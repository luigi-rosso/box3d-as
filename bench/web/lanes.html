<!doctype html>
<meta charset="utf-8">
<title>Box3D lanes bench</title>
<script type="module">
// lanes.mjs on a page: librive's web scripting page harness loads a bench/threads bake and runs frames until
// the script logs its BENCH RESULT, yielding to the event loop between frames as a page does. jobThreads sizes the
// job pool and parts a parallel call's parts, the page's own included, before the file loads; parallelSafe runs every
// parallel call as one part; until names the log line that ends the run. Each HASH line a HASHLOG bake logs comes
// back in hashes.
// A task of its own between frames, so worker messages run; a timer chain can be throttled to one wake a minute
const channel = new MessageChannel();
const nextTask = () => new Promise( ( settle ) =>
{
	channel.port1.onmessage = settle;
	channel.port2.postMessage( 0 );
} );

window.runRiv = async ( name, seconds, { jobThreads, parts, parallelSafe, until = 'BENCH RESULT' } = {} ) =>
{
	const lines = [];
	const hashes = [];
	let result = null;
	let size = null;
	// Where a run that never ends got to, for the driver to read
	const state = window.runState = { phase: 'loading', frames: 0, steps: 0, lines };
	const print = ( text ) =>
	{
		const hash = text.match( /HASH step=(\d+) hash=(\d+)/ );
		if ( hash )
		{
			hashes[Number( hash[1] )] = Number( hash[2] );
			state.steps = hashes.length;
			return;
		}
		lines.push( text );
		size ??= text.match( /BENCH parallel size=(\d+)/ )?.[1] ?? null;
		if ( text.includes( until ) )
		{
			result = text;
		}
	};
	const createHarness = ( await import( '/harness/web_scripting_page.mjs' ) ).default;
	const Module = await createHarness( { print, printErr: print } );
	if ( jobThreads !== undefined )
	{
		Module._harness_job_threads( jobThreads );
	}
	if ( parts !== undefined )
	{
		Module.riveScripting.parallelParts = parts;
	}
	if ( parallelSafe )
	{
		Module._harness_parallel_safe();
	}
	const bytes = new Uint8Array( await ( await fetch( `out/lanes/${name}.riv` ) ).arrayBuffer() );
	const ptr = Module._malloc( bytes.length );
	Module.HEAPU8.set( bytes, ptr );
	if ( !Module._harness_import( ptr, bytes.length ) )
	{
		return { error: 'import failed', lines };
	}
	Module._free( ptr );
	state.phase = 'preparing';
	await Module.riveScripting.prepare();
	state.phase = 'running';
	Module._harness_run( 1 );
	const deadline = performance.now() + seconds * 1000;
	while ( result === null && performance.now() < deadline )
	{
		await nextTask();
		Module._harness_frames( 1 );
		state.frames += 1;
	}
	state.phase = 'done';
	const team = Module.riveScripting.parallelState?.() ?? null;
	return { result, lines: result === null || until !== 'BENCH RESULT' ? lines : [], hashes,
		size: size === null ? null : Number( size ), team, crossOriginIsolated: self.crossOriginIsolated,
		userAgent: navigator.userAgent };
};
window.ready = true;
</script>
