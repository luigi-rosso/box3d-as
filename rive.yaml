name: box3d_demo
main: main
scripting: wasm
# Physics steps outrun the 200 ms script budget of the fueled debug bake the live window plays.
dangerouslyFast: true
artboard:
  width: 1280
  height: 800
  background: "#151412"
exclude:
  - verify
  - bench
  - notes
  - demo/fonts/OFL-Inter.txt
  - CONVENTIONS.md
  - LICENSE
output:
  dir: build
logs:
  file: build/rive.log
  problems: build/problems.log
